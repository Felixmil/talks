<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="Slide decks I have presented, archived by date.">
<style>
  :root {
    color-scheme: light dark;
    --fg: #1a1a1a;
    --bg: #ffffff;
    --muted: #6b6b6b;
    --rule: #e4e4e4;
  }
  @media (prefers-color-scheme: dark) {
    :root { --fg: #d6d6d6; --bg: #121212; --muted: #8a8a8a; --rule: #2a2a2a; }
  }

  body {
    max-width: 38rem;
    margin: 0 auto;
    padding: 6rem 1.5rem 8rem;
    background: var(--bg);
    color: var(--fg);
    font: 16px/1.7 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  h1 { font-size: 1.6rem; font-weight: 600; margin: 0 0 2.5rem; letter-spacing: -0.01em; }
  h2 { font-size: 0.8rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em;
       color: var(--muted); margin: 4rem 0 0; }
  h3 { font-size: 1.05rem; font-weight: 600; margin: 2rem 0 0; }
  h3 a { text-decoration: none; }
  h3 a:hover { text-decoration: underline; }

  p { margin: 0.7rem 0 0; }
  ul { margin: 0.9rem 0 0; padding-left: 1.1rem; }
  li { margin: 0.45rem 0 0; }
  li::marker { color: var(--muted); }

  a { color: inherit; text-underline-offset: 3px; text-decoration-color: var(--muted); }
  a:hover { text-decoration-color: currentColor; }

  code {
    font: 0.875em ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color: var(--muted);
  }
  pre {
    margin: 1rem 0 0; padding: 0.9rem 1rem;
    border: 1px solid var(--rule); border-radius: 4px;
    overflow-x: auto;
  }
  pre code { color: var(--fg); }

  table { width: 100%; border-collapse: collapse; margin: 1rem 0 0; display: block; overflow-x: auto; }
  th, td { text-align: left; padding: 0.5rem 0.9rem 0.5rem 0; border-bottom: 1px solid var(--rule); }
  th { color: var(--muted); font-weight: 600; font-size: 0.85rem; }

  footer { margin-top: 5rem; padding-top: 1.2rem; border-top: 1px solid var(--rule);
           color: var(--muted); font-size: 0.85rem; }
</style>
</head>
<body>
<h1>{{heading}}</h1>
{{content}}
<footer>
  <a href="https://github.com/Felixmil/talks">github.com/Felixmil/talks</a>
</footer>
</body>
</html>
